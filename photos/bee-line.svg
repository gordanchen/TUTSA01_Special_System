<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="bee line icon">
  <defs>
    <style>
      .bee-line{
        fill:none;
        stroke:#5B3A00;
        stroke-width:5.5;
        stroke-linecap:round;
        stroke-linejoin:round;
      }
      .bee-fill{
        fill:#5B3A00;
      }
    </style>
  </defs>

  <!-- wings -->
  <path class="bee-line" d="M36 34 C24 18 11 25 16 40 C20 53 33 47 40 40"/>
  <path class="bee-line" d="M60 34 C72 18 85 25 80 40 C76 53 63 47 56 40"/>

  <!-- body -->
  <ellipse class="bee-line" cx="48" cy="54" rx="25" ry="19"/>

  <!-- stripes -->
  <path class="bee-line" d="M36 41 C31 50 31 59 36 67"/>
  <path class="bee-line" d="M48 36 C42 48 42 61 48 72"/>
  <path class="bee-line" d="M60 41 C65 50 65 59 60 67"/>

  <!-- head -->
  <circle class="bee-line" cx="48" cy="27" r="9"/>
  <circle class="bee-fill" cx="45" cy="26" r="1.8"/>
  <circle class="bee-fill" cx="51" cy="26" r="1.8"/>

  <!-- antennae -->
  <path class="bee-line" d="M43 20 C36 12 30 12 26 17"/>
  <path class="bee-line" d="M53 20 C60 12 66 12 70 17"/>

  <!-- tail -->
  <path class="bee-line" d="M72 55 L84 55"/>
</svg>
